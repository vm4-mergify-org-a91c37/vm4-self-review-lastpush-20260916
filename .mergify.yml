pull_request_rules:
  - name: controlled Mergify head update
    conditions:
      - label = vm4-self-update
      - "#commits-behind > 0"
    actions:
      update:
  - name: controlled Mergify self approval
    conditions:
      - label = vm4-self-approve
    actions:
      review:
        type: APPROVE
        message: VM4 controlled Mergify self-approval probe
  - name: controlled protected merge after native ruleset checks
    conditions:
      - label = vm4-self-merge
    actions:
      merge:
        method: squash
  - name: vm4 bot-account permission freshness 240924
    conditions:
      - label = vm4-botfresh-update-240924
      - "#commits-behind > 0"
    actions:
      update:
        bot_account: "livastic-vm4-secondary-20260911"
