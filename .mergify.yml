pull_request_rules:
  - name: controlled Mergify head update
    conditions:
      - label = vm4-self-update
      - "#commits-behind > 0"
    actions:
      update:
  - name: controlled Mergify self approval
    conditions:
      - label = vm4-self-approve
    actions:
      review:
        type: APPROVE
        message: VM4 controlled Mergify self-approval probe
  - name: controlled protected merge after native ruleset checks
    conditions:
      - label = vm4-self-merge
    actions:
      merge:
        method: squash
  - name: vm4 author botaccount approval 240924
    conditions:
      - label = vm4-author-botaccount-approve-240924
    actions:
      review:
        type: APPROVE
        bot_account: "{{author}}"
        message: VM4 author bot-account self approval canary 240924
